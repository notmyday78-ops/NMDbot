version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pegasus}
      POSTGRES_USER: ${POSTGRES_USER:-pegasus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - pegasus-network

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-pegasus}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-pegasus}?sslmode=disable
      REDIS_URL: ${REDIS_URL}
      ENABLE_API: ${ENABLE_API:-true}
      API_PORT: ${API_PORT:-2000}
    ports:
      - "${API_PORT:-2000}:2000"
    networks:
      - pegasus-network
    volumes:
      - bot-logs:/app/logs
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 512M

networks:
  pegasus-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  bot-logs:
    driver: local